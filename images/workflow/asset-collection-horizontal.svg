<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img"><title>브랜드 에셋 수집 자동화</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#999999"/></marker></defs><rect width="1440" height="610" fill="#101010"/><style>text{font-family:Pretendard,Arial,sans-serif;fill:#eeeeee}@media(prefers-reduced-motion:no-preference){rect[rx]{animation:node-reveal .8s ease both}path[marker-end]{stroke-dasharray:800;stroke-dashoffset:800;animation:flow-connect 1.8s ease .35s forwards}@keyframes node-reveal{from{opacity:0}to{opacity:1}}@keyframes flow-connect{to{stroke-dashoffset:0}}}</style>
<text x="32" y="44" font-size="26" fill="#eeeeee" style="fill:#eeeeee">브랜드 에셋 수집 자동화</text>
