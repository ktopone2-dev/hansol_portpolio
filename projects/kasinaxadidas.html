<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
   (function($){

function findElements(selector) {
    let elements = $(selector).toArray();
    const shadowHost = document.querySelector('#shadowWrap');
    if (shadowHost?.shadowRoot) {
        elements = elements.concat([...shadowHost.shadowRoot.querySelectorAll(selector)]);
    }
    return $(elements);
}

let isVisible = false; 

function handleSwiper() {
    var $slides = findElements('.lb_colom_slide');
    if(!$slides.length) return;

    var isMobile = window.innerWidth < 1024;

    $slides.each(function(){
        var el = this;

        if (isMobile && isVisible) {
            if (!el.swiper) {
                new Swiper(el, {
                    slidesPerView: "auto",
                    spaceBetween: 8,
                });
            }
        } else {
            if (el.swiper) {
                el.swiper.destroy(true, true);
            }
        }
    });
}

// 옵저버 세팅을 별도 함수로 분리
function initObserver($target) {
    var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
            if(entry.isIntersecting){
                isVisible = true; 
                handleSwiper();   
                observer.disconnect(); 
            }
        });
    }, { 
        // 핵심 해결책: 요소가 화면에 보이기 직전(화면 높이의 50% 아래에 있을 때) 미리 감지!
        rootMargin: "50% 0px", 
        threshold: 0 
    });

    observer.observe($target[0]);
}

function waitAndInit(){
    var retry = 0;
    var interval = setInterval(function(){
        var $target = findElements('.lb_colom_slide');

        if($target.length){
            clearInterval(interval);
            initObserver($target); // 요소가 찾아지면 즉시 감시 시작
        }

        retry++;
        // 탐색 시도 횟수를 조금 늘려줍니다 (프레임워크 환경 등 고려)
        if(retry > 50){ 
            clearInterval(interval);
        }
    }, 100); // 0.1초 간격으로 빠르게 탐색
}

// 핵심 해결책: window.load 대신 document.ready 사용
// 무거운 영상/이미지 로딩을 기다리지 않고 DOM 구조만 잡히면 바로 실행
$(document).ready(function(){
    waitAndInit();
});

var resizeTimer;
$(window).on('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
        if (isVisible) {
            handleSwiper();
        }
    }, 200); 
});

})(jQuery);
</script><script>
(()=>{let pending=false,last=0;function send(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;const h=Math.ceil(document.documentElement.getBoundingClientRect().height);if(Math.abs(h-last)>2){last=h;parent.postMessage({type:'portfolio-height',height:h},location.origin);}});}new ResizeObserver(send).observe(document.body);window.addEventListener('load',send);document.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();}},true);document.addEventListener('submit',e=>e.preventDefault(),true);send();})();
</script></body></html>
